name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：GitHub Pages 同一时刻只允许**一个**部署在途。
# 没有这段时，两次提交挨得近就会出现：
#   "Deployment request failed for <sha> due to in progress deployment.
#    Please cancel <other-sha> first or wait for it to complete."
# 失败的只是 Pages 那条旁路，生产服务器其实已经部署成功 ——
# 但 CI 会亮红，而红的原因与代码无关。这种红最危险：它训练人忽略红灯。
#
# cancel-in-progress 必须为 false：取消一个**正在进行**的 run 可能把 rsync
# 或服务重启切在半路，留下不一致的服务器状态。排队（等上一轮跑完）是安全的。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 给飞书通知卡片输出：前端/后端测试数、构建耗时
    outputs:
      tests_frontend: ${{ steps.fe-gate.outputs.tests }}
      tests_backend: ${{ steps.be-gate.outputs.tests }}
      duration: ${{ steps.time.outputs.duration }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 前端已独立为 frontend/ 子项目，pnpm lockfile 在 frontend/ 下
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # 质量门禁：测试或类型检查不过就不部署。
      # 之前 CI 只 build —— 白屏级的语法错误（如 setup 里漏 import）照样能上线。
      # 提取测试数（如 "Tests 312 passed"）供飞书卡片展示。
      - name: Quality gate (frontend test + type-check)
        id: fe-gate
        run: |
          pnpm test 2>&1 | tee /tmp/fe-test.log
          test ${PIPESTATUS[0]} -eq 0
          # vue-tsc 曾在本环境静默 exit 1（无任何诊断输出）。tee 保留日志、
          # 限制内存防 OOM、失败时回显尾部 —— 定位到根因后再精简。
          NODE_OPTIONS="--max-old-space-size=4096" pnpm type-check 2>&1 | tee /tmp/fe-tsc.log
          TSC_EXIT=${PIPESTATUS[0]}
          if [ "$TSC_EXIT" -ne 0 ]; then echo "--- type-check log tail ---"; tail -60 /tmp/fe-tsc.log; fi
          test "$TSC_EXIT" -eq 0
          # 取测试数（供飞书卡片）：
          #  1) 先剥 ANSI 颜色码 —— CI 里 vitest 输出带色，"Tests  310 passed"
          #     实际字节是 "Tests \e[1m\e[32m310 passed"，直接用 grep 匹配不到；
          #  2) 末尾 || true —— 命令替换返回非 0 时 bash -e 会**静默**退出 1
          #     （无任何输出），曾把整步判成失败、部署连续红且难排查。
          #     取数失败只应让卡片显示 "?"，绝不能让门禁本身失败。
          FE_TESTS="$(perl -pe 's/\e\[[0-9;]*m//g' /tmp/fe-test.log | grep -oE 'Tests +[0-9]+ passed' | tail -1 | grep -oE '[0-9]+' || true)"
          echo "tests=${FE_TESTS:-?}" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      # 后端质量门禁 + OpenAPI 契约同步校验：
      # openapi.json 是前端类型的单一契约源（src/types/api.ts 由它生成）。
      # 后端接口变更后必须重新导出并提交；此处 export 后 git diff 非空 → 构建失败，
      # 防止"后端改了、前端类型没同步"的静默漂移。
      - name: Backend test + OpenAPI contract check
        id: be-gate
        run: |
          cd backend
          python -m pip install -q -r requirements.txt
          KIDS_JWT_SECRET=ci-secret-$(printf 'k%.0s' {1..32}) python -m pytest tests/ -q 2>&1 | tee /tmp/be-test.log
          test ${PIPESTATUS[0]} -eq 0
          python scripts/export_openapi.py
          # pathspec 相对当前目录（此时在 backend/ 下）——写成 backend/openapi.json
          # 会匹配不到任何文件，git diff 恒返回 0，这项契约校验等于空转。
          git diff --exit-code -- openapi.json
          cd ..
          # 同 fe-gate：剥 ANSI + || true，避免取数失败把整步拖挂
          BE_TESTS="$(perl -pe 's/\e\[[0-9;]*m//g' /tmp/be-test.log | grep -oE '[0-9]+ passed' | tail -1 | grep -oE '[0-9]+' || true)"
          echo "tests=${BE_TESTS:-?}" >> "$GITHUB_OUTPUT"

      # 课程内容单一事实源防漂移（ADR-001）：
      # frontend/src/data/lessons.ts 是唯一人工书写源，backend/seed/lessons.json 是它的生成物
      # （git 跟踪）。前端 content store 是「远端优先」——种子过期时后端会拿旧内容**盖掉**
      # 前端新内容，表现为「改了课、也部署了，线上就是不变」，且本地（后端没起）完全复现不出。
      # 与 openapi.json 契约校验完全同构：生成物入库 + 导出后 git diff 必须为空。
      - name: Content seed drift check
        run: |
          cd frontend
          pnpm export:lessons
          cd ..
          # pathspec 必须相对仓库根写全（backend/seed/lessons.json）；写 openapi.json 那种
          # 相对当前目录的写法在这里会匹配不到文件、git diff 恒返回 0，校验等于空转。
          git diff --exit-code -- backend/seed/lessons.json

      - name: Build
        # 自定义域名（zelab.cn）部署在根路径，必须用 build:root（BASE_PATH=/）；
        # 无自定义域名走 GitHub Pages 子路径时改回 GH_REPO=... pnpm build:ci
        run: |
          pnpm build:root
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # 服务器部署（华为云 110.41.61.4）：构建在 GitHub 侧完成，
      # 产物 rsync 上传到服务器（入站方向，不受服务器访问 GitHub 慢影响）。
      # 需先在 repo 配置 Actions secret DEPLOY_KEY（部署密钥私钥）。
      - name: Deploy to Huawei server (rsync)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::未配置 DEPLOY_KEY secret，跳过服务器部署"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cd frontend
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            dist/ root@110.41.61.4:/www/wwwroot/kids-english/www/

      # 后端部署（ADR-003）：给后端与前端同等的交付待遇 —— 代码 rsync + 重启 + 健康校验。
      # 目标目录与 systemd 单元（2026-10-17 已 SSH 核对）：
      #   WorkingDirectory=/www/wwwroot/kids-english/backend
      #   ExecStart=.../backend/.venv/bin/uvicorn main:app
      # 红线：**代码同步，数据与凭据永不同步** —— 生产库/录音/.env/.venv 只属于服务器。
      - name: Deploy backend to Huawei server (rsync + health check)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::未配置 DEPLOY_KEY secret，跳过后端部署"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          BE=/www/wwwroot/kids-english/backend

          # 依赖只在 requirements.txt 真变化时才装（避免每次部署都跑 pip）
          REQ_BEFORE=$($SSH root@110.41.61.4 "md5sum $BE/requirements.txt 2>/dev/null" | awk '{print $1}')

          rsync -az --delete -e "$SSH" \
            --exclude '.venv' --exclude '__pycache__/' --exclude '.pytest_cache/' \
            --include '.env.example' --exclude '.env' --exclude '.env.*' \
            --exclude '*.db' --exclude '*.db-wal' --exclude '*.db-shm' \
            --exclude 'media/' \
            backend/ root@110.41.61.4:$BE/

          REQ_AFTER=$($SSH root@110.41.61.4 "md5sum $BE/requirements.txt 2>/dev/null" | awk '{print $1}')
          if [ -n "$REQ_AFTER" ] && [ "$REQ_BEFORE" != "$REQ_AFTER" ]; then
            echo "requirements.txt 有变化 → 安装依赖"
            $SSH root@110.41.61.4 "cd $BE && .venv/bin/python -m pip install -q -r requirements.txt"
          fi

          echo "重启 kids-api（迁移在启动时运行；失败则服务起不来，下方探测会失败）"
          $SSH root@110.41.61.4 'systemctl restart kids-api'

          # 健康校验：非 200 即让 job 失败 —— 否则 Actions 报绿、服务其实是死的
          for i in $(seq 1 15); do
            if curl -sf -m 5 http://110.41.61.4/api/ping >/dev/null; then
              echo "✅ /api/ping 正常（第 $i 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::重启后 /api/ping 在 30s 内未返回 200 —— 回显 journal 供排查"
          $SSH root@110.41.61.4 'journalctl -u kids-api -n 60 --no-pager' || true
          exit 1

      # 构建耗时（供飞书卡片展示）
      - name: Record build duration
        id: time
        if: always()
        run: |
          START_EPOCH=$(date -d "${{ job.started_at }}" +%s)
          echo "duration=$(($(date +%s) - START_EPOCH))" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 飞书机器人通知：每次构建「无论成败」都推送到家长飞书群，第一时间知道部署状态。
  # 需先在 repo Settings → Secrets and variables → Actions 添加 FEISHU_WEBHOOK
  # （飞书群「自定义机器人」webhook 完整 URL，含签名）；未配置时自动跳过，不影响部署。
  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compose Feishu message
        id: compose
        env:
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          FE_TESTS: ${{ needs.build.outputs.tests_frontend }}
          BE_TESTS: ${{ needs.build.outputs.tests_backend }}
          DURATION: ${{ needs.build.outputs.duration }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # 整体状态：构建失败 > 部署失败 > 成功（build 失败时 deploy 会 skipped）
          if [ "$BUILD" = "failure" ]; then
            OVERALL="failure"
            FAIL_AT="构建阶段"
          elif [ "$DEPLOY" = "failure" ]; then
            OVERALL="deploy-fail"
            FAIL_AT="部署阶段"
          else
            OVERALL="success"
            FAIL_AT=""
          fi

          # 从 GitHub 事件里取提交信息（workflow_dispatch 手动触发时 head_commit 为空）
          COMMIT_MSG="$(jq -r '.head_commit.message // "手动触发"' "$GITHUB_EVENT_PATH" 2>/dev/null | tr '\n' ' ' | head -c 120)"
          AUTHOR="$(jq -r '.head_commit.author.name // "unknown"' "$GITHUB_EVENT_PATH" 2>/dev/null)"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          ACTOR="${GITHUB_ACTOR:-unknown}"
          RUN_NO="${GITHUB_RUN_NUMBER:-?}"

          # 耗时格式化：X 分 Y 秒
          if [ -n "$DURATION" ] && [ "$DURATION" -gt 0 ] 2>/dev/null; then
            DUR_MIN=$((DURATION / 60)); DUR_SEC=$((DURATION % 60))
            DUR_TXT="${DUR_MIN}分${DUR_SEC}秒"
          else
            DUR_TXT="—"
          fi

          # 状态文案：success / failure / cancelled / skipped
          ok() { [ "$1" = "success" ] && echo '✅' || { [ "$1" = "failure" ] && echo '❌' || echo '⏭️'; }; }
          BUILD_ICON="$(ok "$BUILD")"; DEPLOY_ICON="$(ok "$DEPLOY")"

          # 构建/部署状态行（失败时标注失败阶段）
          if [ "$OVERALL" = "success" ]; then
            STATUS_LINE="构建 ${BUILD_ICON} ｜ 部署 ${DEPLOY_ICON} ｜ 耗时 ${DUR_TXT}"
          else
            STATUS_LINE="构建 ${BUILD_ICON} ｜ 部署 ${DEPLOY_ICON} ｜ 耗时 ${DUR_TXT}\n**❌ 失败于：** ${FAIL_AT}"
          fi

          # 测试行（后端契约/质量门禁都通过才展示数字）
          TESTS_LINE="测试：前端 ${FE_TESTS:-?} ｜ 后端 ${BE_TESTS:-?}"

          # 部署地址行
          if [ "$OVERALL" = "success" ]; then
            DEPLOY_LINE="**部署地址：** https://zelab.cn\n${PAGE_URL:+GitHub Pages：$PAGE_URL}"
          else
            DEPLOY_LINE="**部署地址：** https://zelab.cn（本次未更新）"
          fi

          # 构造飞书交互卡片 JSON
          jq -n \
            --arg title "$([ "$OVERALL" = "success" ] && echo '✅ kids-english 部署成功' || echo '❌ kids-english 构建/部署未通过')" \
            --arg template "$([ "$OVERALL" = "success" ] && echo 'green' || echo 'red')" \
            --arg status "$STATUS_LINE" --arg tests "$TESTS_LINE" \
            --arg commit "${SHA_SHORT} · ${COMMIT_MSG}" --arg author "$AUTHOR" \
            --arg time "$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg deploy_line "$DEPLOY_LINE" --arg branch "$BRANCH" --arg actor "$ACTOR" --arg runno "$RUN_NO" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true },
                header: { title: { tag: "plain_text", content: $title }, template: $template },
                elements: [
                  { tag: "div", text: { tag: "lark_md", content: $status } },
                  { tag: "hr" },
                  { tag: "div", text: { tag: "lark_md", content: $tests } },
                  { tag: "div", text: { tag: "lark_md", content: "**提交：** \($commit)\n**分支：** \($branch) ｜ **作者：** \($author) ｜ **触发：** \($actor)" } },
                  { tag: "div", text: { tag: "lark_md", content: "**时间：** \($time) (UTC+8) ｜ **Run #** \($runno)" } },
                  { tag: "div", text: { tag: "lark_md", content: $deploy_line } },
                  { tag: "hr" },
                  { tag: "action", actions: [
                      { tag: "button", text: { tag: "plain_text", content: "查看构建详情" }, type: "primary", url: $run },
                      { tag: "button", text: { tag: "plain_text", content: "打开网站" }, type: "default", url: "https://zelab.cn" }
                    ] }
                ]
              }
            }' > /tmp/feishu-payload.json
          cat /tmp/feishu-payload.json
      - name: Send to Feishu bot
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "::warning::未配置 FEISHU_WEBHOOK secret，跳过飞书通知（不影响部署）"
            exit 0
          fi
          curl -sS -X POST -H "Content-Type: application/json" \
            -d @/tmp/feishu-payload.json "$FEISHU_WEBHOOK" | tee /tmp/feishu-resp.json
          # 飞书返回 code!=0 视为发送失败，让 CI 可见但不阻断部署结果
          if ! jq -e '.code == 0' /tmp/feishu-resp.json >/dev/null 2>&1; then
            echo "::error::飞书机器人发送失败: $(cat /tmp/feishu-resp.json)"
          fi
