name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 前端已独立为 frontend/ 子项目，pnpm lockfile 在 frontend/ 下
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # 质量门禁：测试或类型检查不过就不部署。
      # 之前 CI 只 build —— 白屏级的语法错误（如 setup 里漏 import）照样能上线。
      - name: Quality gate (frontend test + type-check)
        run: |
          pnpm test
          pnpm type-check
        working-directory: frontend

      # 后端质量门禁 + OpenAPI 契约同步校验：
      # openapi.json 是前端类型的单一契约源（src/types/api.ts 由它生成）。
      # 后端接口变更后必须重新导出并提交；此处 export 后 git diff 非空 → 构建失败，
      # 防止"后端改了、前端类型没同步"的静默漂移。
      - name: Backend test + OpenAPI contract check
        run: |
          cd backend
          python -m pip install -q -r requirements.txt
          KIDS_JWT_SECRET=ci-secret-$(printf 'k%.0s' {1..32}) python -m pytest tests/ -q
          python scripts/export_openapi.py
          git diff --exit-code -- backend/openapi.json
          cd ..

      - name: Build
        # 自定义域名（zelab.cn）部署在根路径，必须用 build:root（BASE_PATH=/）；
        # 无自定义域名走 GitHub Pages 子路径时改回 GH_REPO=... pnpm build:ci
        run: |
          pnpm build:root
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # 服务器部署（华为云 110.41.61.4）：构建在 GitHub 侧完成，
      # 产物 rsync 上传到服务器（入站方向，不受服务器访问 GitHub 慢影响）。
      # 需先在 repo 配置 Actions secret DEPLOY_KEY（部署密钥私钥）。
      - name: Deploy to Huawei server (rsync)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::未配置 DEPLOY_KEY secret，跳过服务器部署"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cd frontend
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            dist/ root@110.41.61.4:/www/wwwroot/kids-english/www/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
