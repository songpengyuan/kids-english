name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # 质量门禁：测试或类型检查不过就不部署。
      # 之前 CI 只 build —— 白屏级的语法错误（如 setup 里漏 import）照样能上线。
      - name: Quality gate (test + type-check)
        run: |
          pnpm test
          pnpm type-check

      - name: Build
        run: |
          GH_REPO="${{ github.event.repository.name }}" pnpm build:ci
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
