    <meta name="description" content="闲思杂记——个人技术实践、阅读随笔、文稿记录的原创个人笔记站点。" />
    <meta name="keywords" content="闲思杂记,zelab.cn,个人笔记,技术实践,随笔" />

    <style>
      /* ============ 闲思杂记 · 备案首页（纯静态，无外部依赖） ============
         视觉基调参考 deepseek.com：白底、品牌蓝 #4d6bfe、居中大标题、
         克制的卡片网格与光晕。备案合规内容（非经营性声明/备案号）原样保留。 */
      :root {
        --ink: #1b2333;
        --ink-soft: #5b6474;
        --ink-faint: #9099a8;
        --line: #e6eaf2;
        --paper: #ffffff;
        --paper-soft: #f7f9fc;
        --brand: #4d6bfe;
        --brand-deep: #3b55e0;
        --brand-soft: #eef2ff;
        --cyan: #22c1dc;
        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
        --shadow-lg: 0 12px 32px -8px rgba(77, 107, 254, 0.18);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: var(--paper);
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      a { color: var(--brand); text-decoration: none; }
      a:hover { text-decoration: none; }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

      /* ---------- 背景装饰：淡网格 + 双光晕（纯 CSS，无图片） ---------- */
      .bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background:
          linear-gradient(rgba(77, 107, 254, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(77, 107, 254, 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
        mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
      }
      .bg::before, .bg::after {
        content: "";
        position: absolute;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.5;
      }
      .bg::before { background: radial-gradient(circle, rgba(77, 107, 254, 0.35), transparent 65%); top: -180px; left: -120px; animation: drift 14s ease-in-out infinite alternate; }
      .bg::after { background: radial-gradient(circle, rgba(34, 193, 220, 0.3), transparent 65%); top: -140px; right: -140px; animation: drift 18s ease-in-out infinite alternate-reverse; }
      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(60px, 40px) scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bg::before, .bg::after { animation: none; }
        html { scroll-behavior: auto; }
      }

      /* ---------- 顶栏：毛玻璃吸顶 ---------- */
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px clamp(20px, 5vw, 48px);
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
        -webkit-backdrop-filter: saturate(1.4) blur(12px);
        backdrop-filter: saturate(1.4) blur(12px);
      }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; letter-spacing: 1px; color: var(--ink); }
      .brand .mark {
        width: 34px; height: 34px; flex: none;
        display: grid; place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--brand), var(--cyan));
        box-shadow: 0 4px 12px rgba(77, 107, 254, 0.35);
        color: #fff;
      }
      .brand .mark svg { width: 18px; height: 18px; }
      .brand small { font-size: 12px; font-weight: 400; color: var(--ink-faint); letter-spacing: 0; margin-left: 2px; }
      nav { display: flex; align-items: center; gap: 22px; font-size: 14px; }
      nav > a:not(.enter-btn) { color: var(--ink-soft); transition: color .18s; }
      nav > a:not(.enter-btn):hover { color: var(--ink); }
      .enter-btn {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--brand); color: #fff;
        border-radius: 999px;
        padding: 8px 20px;
        font-size: 14px; font-weight: 600;
        box-shadow: 0 4px 14px rgba(77, 107, 254, 0.35);
        transition: transform .18s, box-shadow .18s, background .18s;
      }
      .enter-btn:hover { background: var(--brand-deep); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(77, 107, 254, 0.45); }
      .enter-btn svg { width: 15px; height: 15px; }

      /* ---------- 主视觉：居中大标题 + 渐变字 ---------- */
      .hero {
        position: relative;
        padding: clamp(72px, 12vw, 140px) clamp(20px, 5vw, 48px) clamp(48px, 7vw, 88px);
        max-width: 880px;
        margin: 0 auto;
        text-align: center;
      }
      .hero .eyebrow {
        display: inline-flex; align-items: center; gap: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.8);
        border-radius: 999px;
        padding: 6px 16px;
        font-size: 13px;
        color: var(--ink-soft);
        box-shadow: var(--shadow-sm);
      }
      .hero .eyebrow::before {
        content: "";
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--brand);
        box-shadow: 0 0 0 3px rgba(77, 107, 254, 0.18);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(77, 107, 254, 0.08); } }
      .hero h1 {
        margin-top: 26px;
        font-size: clamp(40px, 7.5vw, 68px);
        font-weight: 800;
        letter-spacing: 4px;
        line-height: 1.15;
        background: linear-gradient(120deg, var(--ink) 20%, var(--brand) 55%, var(--cyan) 90%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      .hero .sub {
        margin: 20px auto 0;
        max-width: 560px;
        color: var(--ink-soft);
        font-size: clamp(15px, 2.4vw, 17px);
      }
      .hero .cta { margin-top: 34px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
      .cta .primary, .cta .ghost {
        display: inline-flex; align-items: center; gap: 8px;
        border-radius: 12px;
        padding: 12px 26px;
        font-size: 15px; font-weight: 600;
        transition: transform .18s, box-shadow .18s, background .18s, border-color .18s;
      }
      .cta .primary { background: var(--brand); color: #fff; box-shadow: 0 8px 20px rgba(77, 107, 254, 0.35); }
      .cta .primary:hover { background: var(--brand-deep); transform: translateY(-2px); box-shadow: 0 12px 26px rgba(77, 107, 254, 0.45); }
      .cta .primary svg { width: 16px; height: 16px; }
      .cta .ghost { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.85); color: var(--ink); }
      .cta .ghost:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-2px); }
      .hero .tags { margin-top: 36px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .hero .tags span {
        display: inline-flex; align-items: center; gap: 7px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink-soft);
        border-radius: 999px; padding: 6px 15px; font-size: 13px;
      }
      .hero .tags span::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); }

      /* ---------- 卡片区：deepseek 式圆角卡片 + 悬浮抬升 ---------- */
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 clamp(20px, 5vw, 48px) clamp(56px, 8vw, 96px);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }
      .col {
        position: relative;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 26px 24px;
        box-shadow: var(--shadow-sm);
        transition: transform .22s, box-shadow .22s, border-color .22s;
      }
      .col:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: rgba(77, 107, 254, 0.35); }
      .col .ico {
        width: 42px; height: 42px;
        display: grid; place-items: center;
        border-radius: 12px;
        background: var(--brand-soft);
        color: var(--brand);
      }
      .col .ico svg { width: 22px; height: 22px; }
      .col h2 { margin-top: 16px; font-size: 17px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
      .col h2 .pill {
        margin-left: auto;
        font-size: 11px; font-weight: 500; letter-spacing: 0;
        color: var(--brand);
        background: var(--brand-soft);
        border-radius: 999px; padding: 2px 10px;
      }
      .col ul { list-style: none; margin-top: 12px; }
      .col li { padding: 11px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
      .col li:last-child { border-bottom: 0; }
      .col li a { color: var(--ink); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; transition: color .18s; }
      .col li a:hover { color: var(--brand); }
      .col li small { color: var(--ink-faint); font-size: 12px; flex: none; }

      /* ---------- 备案合规区（内容保持不变） ---------- */
      .footer {
        border-top: 1px solid var(--line);
        background: var(--paper-soft);
        padding: 32px clamp(20px, 5vw, 48px) 40px;
        text-align: center;
        font-size: 13px;
        color: var(--ink-soft);
        line-height: 2.1;
      }
      .footer .site-name { color: var(--ink); font-weight: 600; }
      .footer .beian {
        display: inline-block;
        margin-top: 6px;
        color: var(--ink-soft);
        border-bottom: 1px dashed var(--ink-faint);
        padding-bottom: 1px;
        transition: color .18s, border-color .18s;
      }
      .footer .beian:hover { color: var(--brand); border-color: var(--brand); }

      @media (max-width: 560px) {
        header { padding: 12px 16px; }
        nav { gap: 14px; }
        nav > a:not(.enter-btn) { display: none; } /* 小屏收起文字导航，保 CTA */
        .hero h1 { letter-spacing: 2px; }
        main { padding-bottom: 40px; }
      }
    </style>
  </head>
