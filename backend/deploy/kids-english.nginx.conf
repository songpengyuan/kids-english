# kids-english 华为云 ECS（110.41.61.4）nginx 站点配置 —— 入库副本
#
# 线上权威文件：/etc/nginx/sites-available/kids-english.conf
# 启用方式：/etc/nginx/sites-enabled/kids-english.conf -> ../sites-available/kids-english.conf（符号链接）
# 域名：zelab.cn、www.zelab.cn（阿里云云解析 A 记录均指向 110.41.61.4）
#
# 结构：
#   · 443 server：静态站点 root=/www/wwwroot/kids-english/www；/api/ 反代本机 kids-api(127.0.0.1:8000)
#   · 80 server：裸域 / www 一律 301 到 https（certbot --redirect 生成）
#
# 证书：Let's Encrypt，目录 /etc/letsencrypt/live/zelab.cn/（ECDSA；certbot.timer enabled+active 自动续期）
#   标 `# managed by Certbot` 的行不要手工编辑；换域名 / 重签用：
#     certbot --nginx -d zelab.cn -d www.zelab.cn --redirect
#
# 变更流程（先在线上验证，再把线上最终内容回写本副本）：
#   1) 改 /etc/nginx/sites-available/kids-english.conf
#   2) nginx -t && systemctl reload nginx
#   3) diff 线上文件与本副本，回写 backend/deploy/kids-english.nginx.conf
# 反向（以本副本为准推到线上）：
#   install -m 644 backend/deploy/kids-english.nginx.conf \
#     /etc/nginx/sites-available/kids-english.conf && nginx -t && systemctl reload nginx
#
# 外部依赖：华为云安全组放行 TCP 80/443；systemd kids-api active；前端产物 rsync 到 root 目录。
# 本文件只引用证书路径，不含任何私钥内容。

server {
    server_name zelab.cn www.zelab.cn;

    root /www/wwwroot/kids-english/www;
    index index.html;

    # 入口与 SW：每次校验，保证发布立即生效（避免浏览器启发式缓存旧壳）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：长缓存，命中后零请求
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zelab.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zelab.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.zelab.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = zelab.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name zelab.cn www.zelab.cn;
    return 404; # managed by Certbot
}
