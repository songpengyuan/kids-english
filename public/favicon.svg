<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ec9ff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
  </defs>
  <!-- 圆角渐变底 -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bg)"/>
  <!-- 耳朵（外） -->
  <path d="M132 170 L96 52 L212 112 Z" fill="url(#fur)" stroke="#e85d24" stroke-width="8" stroke-linejoin="round"/>
  <path d="M380 170 L416 52 L300 112 Z" fill="url(#fur)" stroke="#e85d24" stroke-width="8" stroke-linejoin="round"/>
  <!-- 耳内粉 -->
  <path d="M126 150 L104 74 L188 116 Z" fill="#ffd9c4"/>
  <path d="M386 150 L408 74 L324 116 Z" fill="#ffd9c4"/>
  <!-- 狐狸脸（心形） -->
  <path d="M256 108 C 150 108 108 176 108 244 C 108 308 152 348 256 404 C 360 348 404 308 404 244 C 404 176 362 108 256 108 Z"
        fill="url(#fur)" stroke="#e85d24" stroke-width="8" stroke-linejoin="round"/>
  <!-- 白吻 -->
  <path d="M256 252 C 314 252 356 280 356 320 C 356 362 320 396 256 404 C 192 396 156 362 156 320 C 156 280 198 252 256 252 Z"
        fill="#fff7ef"/>
  <!-- 腮红 -->
  <circle cx="168" cy="292" r="16" fill="#ff9f8a" opacity="0.45"/>
  <circle cx="344" cy="292" r="16" fill="#ff9f8a" opacity="0.45"/>
  <!-- 眼睛 -->
  <circle cx="204" cy="222" r="20" fill="#3a2a1a"/>
  <circle cx="308" cy="222" r="20" fill="#3a2a1a"/>
  <circle cx="210" cy="216" r="7" fill="#fff"/>
  <circle cx="314" cy="216" r="7" fill="#fff"/>
  <!-- 鼻子 -->
  <circle cx="256" cy="318" r="15" fill="#3a2a1a"/>
  <!-- 微笑 -->
  <path d="M240 350 Q 256 362 272 350" stroke="#3a2a1a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- 右上角小星 -->
  <path d="M 392 88 l 13 28 30 4 -22 21 5 30 -26 -14 -26 14 5 -30 -22 -21 30 -4 z"
        fill="#ffd44d" stroke="#f0a818" stroke-width="6" stroke-linejoin="round"/>
</svg>
